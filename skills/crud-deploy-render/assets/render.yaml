# Render Blueprint: one Docker web service (API + SPA) and one Postgres database.
# Docs: https://render.com/docs/blueprint-spec   Validate: `task render:validate`
services:
  - type: web
    name: app # becomes https://app-xxxx.onrender.com; rename per project
    runtime: docker
    plan: free # free instances sleep when idle; use starter or higher for always-on
    region: frankfurt # oregon | ohio | virginia | frankfurt | singapore (same as the database)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit # deploy on every push to the linked branch
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # random 256-bit value created once by Render
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false # Render asks for this when the Blueprint is first created
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: ALLOW_SIGNUP
        value: "false"

databases:
  - name: app-db
    plan: free # free databases expire after a limited time; pick a paid plan for real data
    region: frankfurt
    databaseName: app
    user: app
    ipAllowList: [] # only reachable from Render services in the same region
